services:
  web:
    build: .
    restart: unless-stopped
    # Reachable only from the host's own nginx, never directly from the internet.
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:8080'
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      retries: 3
